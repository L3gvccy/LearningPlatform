{% extends 'base.html' %}
{% load static %}
{% block content %}

<div class="container py-4">
    <div class="col-md-4 mx-auto rounded border p-3">

        <form method="post">
            {% csrf_token %}

            <h3 class="mb-3 text-center">Додати викладача</h3>

            <div class="mb-3">
                <label for="login" class="form-label">Логін</label>
                <input type="text" name="login" class="form-control" value="{{ login }}">
                {% if login_err %}
                <p class="text-danger">{{ login_err }}</p>
                {% endif %}
            </div>
            
            <div class="mb-3">
                <label for="pass" class="form-label">Пароль</label>
                <input type="text" name="pass" class="form-control">
                {% if pass_err %}
                <p class="text-danger">{{ pass_err }}</p>
                {% endif %}
            </div>
            
            <div class="mb-3">
                <label for="confirm_pass" class="form-label">Повтор паролю</label>
                <input type="text" name="confirm_pass" class="form-control">
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="text" name="email" class="form-control" value="{{ email }}">
            </div>

            <div class="mb-3">
                <label for="lastname" class="form-label">Прізвище</label>
                <input type="text" name="lastname" class="form-control" value="{{ lastname }}">
            </div>

            <div class="mb-3">
                <label for="firstname" class="form-label">Ім'я</label>
                <input type="text" name="firstname" class="form-control" value="{{ firstname }}">
            </div>

            <button type="submit" class="btn btn-aquagreen rounded text-light text-center w-100">Додати викладача</button>
        </form>

        <p class="text-center mt-3 mb-1"><a href="/" class="text-aquagreen">Назад на головну</a></p>
        
    </div>
</div>

{% endblock %}
