{% extends 'base.html' %}
{% load static %}
{% block title %}Створити завдання{% endblock %}
{% block content %}

<div class="container py-4">
    <div class="col-md-4 mx-auto rounded border p-3">
        <form method="post">
            {% csrf_token %}

            <h3 class="mb-3 text-center">Створити завдання</h3>

            <div class="mb-3">
                <label for="title" class="form-label">Назва завдання</label>
                <input name="title" id="title" class="form-control" value="{{ title }}" required>
                {% if title_err %}
                <p class="text-danger">{{ title_err }}</p>
                {% endif %}
            </div>

            <div class="mb-3">
                <label for="content" class="form-label">Опис завдання</label>
                <textarea name="content" id="content" class="form-control" rows="3" required>{{ description }}</textarea>
                {% if content_err %}
                <p class="text-danger">{{ content_err }}</p>
                {% endif %}
            </div>

            <div class="mb-3">
                <label for="due_date" class="form-label">Кінцева дата</label>
                <input type="date" name="due_date" id="due_date" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-aquagreen rounded text-light text-center w-100">Створити</button>
        </form>
    </div>
</div>

{% endblock %}
