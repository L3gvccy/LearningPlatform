{% extends 'base.html' %}
{% load static %}
{% block title %}Редагувати завдання{% endblock %}
{% block content %}

<div class="container py-4">
    <a href="{% url 'view_lesson' assignment.lesson.course.courseId assignment.lesson.id %}" class="text-decoration-none text-secondary">&larr; Назад до уроку</a>

    <div class="col-md-4 mx-auto rounded border p-3">
        <form method="post">
            {% csrf_token %}

            <h3 class="mb-3 text-center">Редагувати завдання</h3>

            <div class="mb-3">
                <label for="title" class="form-label">Назва завдання</label>
                <input name="title" id="title" class="form-control" value="{{ assignment.title }}" required>
                {% if title_err %}
                <p class="text-danger">{{ title_err }}</p>
                {% endif %}
            </div>

            <div class="mb-3">
                <label for="desc" class="form-label">Опис завдання</label>
                <textarea name="desc" id="desc" class="form-control" rows="3" required>{{ assignment.desc }}</textarea>
                {% if content_err %}
                <p class="text-danger">{{ content_err }}</p>
                {% endif %}
            </div>

            <div class="mb-3">
                <label for="due_date" class="form-label">Кінцева дата</label>
                <input type="date" name="due_date" id="due_date" class="form-control" value="{{ assignment.due_date|date:'Y-m-d' }}" required>
            </div>

            <button type="submit" class="btn btn-aquagreen rounded text-light text-center w-100">Підтвердити зміни</button>
        </form>
    </div>
</div>

{% endblock %}
