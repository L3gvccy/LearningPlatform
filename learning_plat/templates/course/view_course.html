{% extends 'base.html' %}
{% load static %}
{% block title %}{{ course.title }}{% endblock %}
{% block content %}

<div class="container my-4 rounded border p-0">
    <div class="bg-{{ course.color }} text-light p-4 rounded-top">
        <h2>{{ course.title }}</h2>
        <p class="text-light mb-0"><span class="fw-bold">Код курсу:</span> {{ course.courseId }}</p>
    </div>
    {% if user.is_staff %}
        <div class="border-bottom px-4 py-2">
            <a href="" class="btn btn-aquagreen px-4 text-light">Додати урок</a>
            <a href="{% url 'edit_course' course.courseId %}" class="btn btn-secondary px-4">Редагувати курс</a>
            <a href="" class="btn btn-danger px-4">Видалити курс</a>
        </div>
    {% endif %}
    <div class="p-4"></div>
</div>

{% endblock %}
